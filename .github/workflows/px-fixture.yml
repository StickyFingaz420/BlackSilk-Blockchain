name: PX fixture determinism

# Regenerates both PX fixtures from their fixed seeds on two Linux runners,
# x86-64 (ubuntu-24.04) and aarch64 (ubuntu-24.04-arm), and compares them
# with the committed files (decisions, "Two-function PX fixture: test-pinned,
# CI regenerates and compares hashes, never commits"):
#
# - the golden transfer fixture, node/src/px_fixture.{bin,txt}
#   (node/tests/px_fixture.rs, regenerate_the_golden_px_fixture;
#   consensus-pinned through the rules fingerprint);
# - the two-function fixture, node/tests/fixtures/px_fixture_2fn.{bin,txt}
#   (node/tests/px_fixture_2fn.rs, regenerate_the_two_function_px_fixture;
#   test-pinned).
#
# Each generator writes into a temporary directory (PX_FIXTURE_OUT), never
# into the checkout. The output directory must not exist before the first
# generator, and every regenerated file must be newer than a stamp taken
# then, so a file the generators did not write cannot pass. The compare step
# walks an explicit list of the four expected files, fails on a missing or
# empty one, prints the committed and regenerated SHA-256 and size of each,
# and passes only if exactly four are the same. Nothing is uploaded or
# committed. Manual only: two PX proofs, the two-function one about 6.4 to
# 6.7 GB peak, so the Guard step refuses a runner with less than 15 GB
# (15,360 MiB) of MemTotal. The generators run one after the other, one test
# thread each. The two legs are independent (fail-fast off).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  regenerate:
    name: regenerate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # `shell: bash` runs every step as `bash -eo pipefail`, so a failing
    # generator piped into tee fails its step.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1"
      - name: Platform (the expected architecture, or fail)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          uname -m
          rustc -vV
          rustc --print cfg | grep -E '^target_(arch|feature)='
          [ "$(uname -m)" = "$ARCH" ] || { echo "::error title=px-fixture::uname -m is $(uname -m), expected $ARCH"; exit 1; }
          rustc --print cfg | grep -qx "target_arch=\"$ARCH\"" || { echo "::error title=px-fixture::rustc does not target $ARCH"; exit 1; }
          if [ "$ARCH" = aarch64 ]; then
            rustc --print cfg | grep -qx 'target_feature="neon"' || { echo "::error title=px-fixture::NEON is not enabled"; exit 1; }
          fi
      - name: Guard (runner RAM)
        run: |
          total=$(awk '/^MemTotal:/ {print int($2 / 1024)}' /proc/meminfo)
          echo "MemTotal: $total MiB"
          nproc
          if [ "$total" -lt 15360 ]; then
            echo "::error::runner has $total MiB of RAM, below 15,360 MiB: use a 16 GB runner"
            exit 1
          fi
      - name: Build
        run: cargo test --locked --release -p blacksilk-node --test px_fixture --test px_fixture_2fn --no-run
      - name: Prepare the output directory (absent, then a start stamp)
        run: |
          out="$RUNNER_TEMP/px-fixture"
          if [ -e "$out" ]; then
            echo "::error title=px-fixture::$out exists before the generators ran"
            exit 1
          fi
          touch "$RUNNER_TEMP/px-fixture.stamp"
          stat -c '%y %n' "$RUNNER_TEMP/px-fixture.stamp"
      - name: Regenerate the transfer fixture
        env:
          PX_FIXTURE_OUT: ${{ runner.temp }}/px-fixture
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/time-transfer.txt" \
            cargo test --locked --release -p blacksilk-node --test px_fixture -- \
            --ignored --exact regenerate_the_golden_px_fixture --nocapture --test-threads=1 | tee "$RUNNER_TEMP/transfer.log"
          grep -q '^test result: ok\. 1 passed; 0 failed' "$RUNNER_TEMP/transfer.log" || {
            echo "::error title=px-fixture::the transfer generator did not run exactly one passing test"
            exit 1
          }
          grep -E 'Maximum resident set size|Elapsed \(wall clock\)' "$RUNNER_TEMP/time-transfer.txt"
      - name: Regenerate the two-function fixture
        env:
          PX_FIXTURE_OUT: ${{ runner.temp }}/px-fixture
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/time-2fn.txt" \
            cargo test --locked --release -p blacksilk-node --test px_fixture_2fn -- \
            --ignored --exact regenerate_the_two_function_px_fixture --nocapture --test-threads=1 | tee "$RUNNER_TEMP/2fn.log"
          grep -q '^test result: ok\. 1 passed; 0 failed' "$RUNNER_TEMP/2fn.log" || {
            echo "::error title=px-fixture::the two-function generator did not run exactly one passing test"
            exit 1
          }
          grep -E 'Maximum resident set size|Elapsed \(wall clock\)' "$RUNNER_TEMP/time-2fn.txt"
      - name: Compare with the committed files
        env:
          OUT: ${{ runner.temp }}/px-fixture
          STAMP: ${{ runner.temp }}/px-fixture.stamp
          REPORT: ${{ runner.temp }}/report.md
          LEG: ${{ matrix.os }} (${{ matrix.arch }})
        run: |
          # The four expected files: committed path, regenerated name.
          expected=(
            "node/src/px_fixture.bin px_fixture.bin"
            "node/src/px_fixture.txt px_fixture.txt"
            "node/tests/fixtures/px_fixture_2fn.bin px_fixture_2fn.bin"
            "node/tests/fixtures/px_fixture_2fn.txt px_fixture_2fn.txt"
          )
          bad=0
          same=0
          checked=0
          # The loops run in this shell (not in a pipeline), so the counters survive them.
          echo "## PX fixture determinism, $LEG ($(git rev-parse HEAD))" > "$REPORT"
          echo '```' >> "$REPORT"
          for pair in "${expected[@]}"; do
            read -r committed_path name <<< "$pair"
            regen="$OUT/$name"
            checked=$((checked + 1))
            if [ ! -s "$committed_path" ]; then
              echo "$committed_path: the committed file is missing or empty: FAIL" >> "$REPORT"
              bad=1
              continue
            fi
            if [ ! -f "$regen" ]; then
              echo "$committed_path: $regen is missing: FAIL" >> "$REPORT"
              bad=1
              continue
            fi
            if [ ! -s "$regen" ]; then
              echo "$committed_path: $regen is empty: FAIL" >> "$REPORT"
              bad=1
              continue
            fi
            if [ ! "$regen" -nt "$STAMP" ]; then
              echo "$committed_path: $regen is not newer than the start stamp (not written by this run): FAIL" >> "$REPORT"
              bad=1
              continue
            fi
            committed=$(sha256sum "$committed_path" | cut -d' ' -f1)
            regenerated=$(sha256sum "$regen" | cut -d' ' -f1)
            committed_size=$(stat -c %s "$committed_path")
            regenerated_size=$(stat -c %s "$regen")
            if [ "$committed" = "$regenerated" ] && [ "$committed_size" = "$regenerated_size" ]; then
              verdict=same
              same=$((same + 1))
            else
              verdict=DIFFERENT
              bad=1
            fi
            echo "$committed_path committed $committed ($committed_size bytes) regenerated $regenerated ($regenerated_size bytes, mtime $(stat -c %y "$regen")): $verdict" >> "$REPORT"
          done
          # A file in the output directory that is not on the list is noted, not compared.
          for f in "$OUT"/*; do
            [ -e "$f" ] || continue
            listed=0
            for pair in "${expected[@]}"; do
              read -r _ name <<< "$pair"
              if [ "$(basename "$f")" = "$name" ]; then listed=1; fi
            done
            if [ "$listed" = 0 ]; then echo "note: $f is not an expected fixture file (not compared)" >> "$REPORT"; fi
          done
          echo "checked $checked of ${#expected[@]} expected files; same: $same" >> "$REPORT"
          echo '```' >> "$REPORT"
          tee -a "$GITHUB_STEP_SUMMARY" < "$REPORT"
          if [ "$bad" != 0 ] || [ "$checked" != 4 ] || [ "$same" != 4 ]; then
            echo "::error title=px-fixture::not all four regenerated fixture files equal the committed ones (same: $same of 4)"
            exit 1
          fi
      - name: The checkout is unchanged
        run: |
          git status --porcelain
          git diff --quiet HEAD -- || { echo "::error title=px-fixture::a generator changed a tracked file"; exit 1; }
