name: CI

on:
  # Every pushed branch runs CI, so no candidate branch can skip the Linux and
  # arm64 legs (CI-1); testnet tags get their own run on the exact tagged
  # commit (CI-3).
  push:
    branches: ["**"]
    tags: ["testnet-*"]
  pull_request:
  # Weekly: new RustSec advisories and the RandomX full-mode vectors do not
  # depend on a push (only the `audit` and `randomx-full` jobs run).
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# The jobs only read the repository; the token gets no write access.
permissions:
  contents: read

# One run per event and ref. A newer push to a pull request or to a work
# branch cancels the older run there; runs on main, rebuild/core and tags are
# never cancelled (each is evidence for its commit).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/rebuild/core') }}

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to full commit SHAs:
# - actions/checkout fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 = tag v5.1.0 = v5
#   (Node 24; Node 20 left the runners on 2026-09-23, CI-12). Source, checked
#   2026-09-27: `git ls-remote https://github.com/actions/checkout
#   refs/tags/v5.1.0` (a lightweight tag, so the SHA is the commit), and the
#   action.yml at that commit says `using: node24`.
# - dtolnay/rust-toolchain 02cb101ec7c40f2c49e1d9714d64511d8e1b74de = branch master
#   (verified 2026-09-25)
# Toolchains and tools are pinned to the versions used for the local evidence
# (docs/reviews/review-package.md §3). Every cargo build uses --locked: the
# committed Cargo.lock files are what was reviewed.
jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      - name: Format
        run: |
          cargo fmt --all --check
          (cd fuzz && cargo fmt --check)
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: No unsafe code in project crates
        # Every crate root (lib.rs, main.rs, src/bin/*.rs) must start a line
        # with the attribute itself; a mention in a comment does not count.
        run: |
          for c in randomx consensus crypto tx chain p2p rpc node miner wallet \
                   contracts zk zkvm px-core px tools/labnet tools/genesis; do
            roots=0
            for f in "$c/src/lib.rs" "$c/src/main.rs" "$c"/src/bin/*.rs; do
              [ -f "$f" ] || continue
              roots=$((roots + 1))
              grep -q '^#!\[forbid(unsafe_code)\]' "$f" || { echo "$f lacks #![forbid(unsafe_code)]"; exit 1; }
            done
            [ "$roots" -gt 0 ] || { echo "$c: no crate root found"; exit 1; }
          done

  # The PX proofs make the suite far too slow unoptimized: tests run in release.
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1"
      # Everything except the tests that build PX proofs, in parallel.
      - name: Test (release, non-PX)
        shell: bash
        env:
          ANNOTATE_TIMEOUT: 100m
        run: |
          rc=0
          bash .github/scripts/annotate-tests.sh cargo test --locked --release --workspace --no-fail-fast \
            --exclude blacksilk-tx --exclude blacksilk-px -- \
            --skip restart_rebuilds_the_px_state_exactly \
            --skip px_transactions_travel_the_stem --skip invalid_px_transactions_get_the_relaying_peer_penalized \
            --skip private_funds_move_over_rpc --skip px_records_follow_a_reorganization \
            --skip a_vault_is_deployed --skip an_uncertain_vault_lock || rc=1
          tx_tests=$(ls tx/tests | sed -n 's/\.rs$//p' | grep -vx 'px_consensus\|fuzz_decode' | sed 's/^/--test /')
          bash .github/scripts/annotate-tests.sh cargo test --locked --release --no-fail-fast -p blacksilk-tx --lib $tx_tests || rc=1
          px_tests=$(ls px/tests | sed -n 's/\.rs$//p' | grep -vx 'proof\|unified' | sed 's/^/--test /')
          bash .github/scripts/annotate-tests.sh cargo test --locked --release --no-fail-fast -p blacksilk-px --lib $px_tests || rc=1
          exit $rc
      # The tests that build PX proofs (4-6 GB each), one at a time: run in
      # parallel they exhaust the runner's memory (run 105 was killed, 143).
      - name: Test (release, PX-proving, one at a time)
        shell: bash
        run: |
          set -o pipefail
          run() { bash .github/scripts/annotate-tests.sh cargo test --locked --release "$@" -- --test-threads=1; }
          rc=0
          run -p blacksilk-px --test proof || rc=1
          run -p blacksilk-px --test unified || rc=1
          run -p blacksilk-tx --test px_consensus || rc=1
          run -p blacksilk-tx --test fuzz_decode || rc=1
          run -p blacksilk-chain restart_rebuilds_the_px_state_exactly || rc=1
          run -p blacksilk-wallet --test e2e private_funds_move_over_rpc || rc=1
          run -p blacksilk-wallet --test e2e px_records_follow_a_reorganization || rc=1
          run -p blacksilk-wallet --test e2e a_vault_is_deployed || rc=1
          run -p blacksilk-wallet --test e2e an_uncertain_vault_lock || rc=1
          run -p blacksilk-p2p --test network px_transactions_travel_the_stem || rc=1
          run -p blacksilk-p2p --test network invalid_px_transactions_get_the_relaying_peer_penalized || rc=1
          exit $rc
      # W4-GUARD (RT-STATEFUL): the steps above leave a node with test hooks
      # in target/release (cargo test unifies dev-dependency features), the
      # path a plain release build writes. The script checks that its checks
      # flag that node, then that a plain release build of the node, miner,
      # wallet and genesis tool has no test-only code: by dependency tree,
      # `--version` and binary contents (.github/scripts/build-guard.sh).
      - name: Plain release binaries carry no test code
        if: success() || failure()
        shell: bash
        run: bash .github/scripts/build-guard.sh

  # The release profile has overflow checks and debug assertions off. This job
  # runs the non-PX crates' tests optimized but with both on (and without LTO,
  # to keep the build short), so an arithmetic overflow in consensus, crypto,
  # chain or network code fails a test instead of wrapping silently.
  # Skipped: the tests that build PX proofs (they take hours with checks on;
  # the `test` job runs them):
  #   tx:    px_consensus.rs (all three tests) and fuzz_decode.rs's
  #          every_mutant_decodes_canonically_or_fails_cleanly
  #   chain: manager.rs's restart_rebuilds_the_px_state_exactly
  #   p2p:   network.rs's two px_* / invalid_px_* tests
  overflow:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [core, chain-tx, net]
    env:
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
      CARGO_PROFILE_RELEASE_LTO: "off"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1"
      # Sharded (run 110's single job hit its 240-minute limit), and the test
      # binaries that build PX proofs are excluded as whole binaries, not by
      # test name: a new proving test must never slip in with checks on.
      - name: Test with overflow checks and debug assertions (release, non-PX)
        shell: bash
        env:
          ANNOTATE_TIMEOUT: 200m
        run: |
          skip="--skip restart_rebuilds_the_px_state_exactly             --skip px_transactions_travel_the_stem_and_confirm_everywhere             --skip invalid_px_transactions_get_the_relaying_peer_penalized"
          t() { bash .github/scripts/annotate-tests.sh cargo test --locked --release --no-fail-fast "$@"; }
          rc=0
          case "${{ matrix.shard }}" in
            core)
              t -p blacksilk-randomx -p blacksilk-consensus -p blacksilk-crypto                 -p blacksilk-px-core -p blacksilk-miner || rc=1 ;;
            chain-tx)
              tx_tests=$(ls tx/tests | sed -n 's/\.rs$//p' | grep -vx 'px_consensus\|fuzz_decode' | sed 's/^/--test /')
              t -p blacksilk-tx --lib $tx_tests || rc=1
              t -p blacksilk-chain -- $skip || rc=1 ;;
            net)
              t -p blacksilk-p2p -p blacksilk-node -- $skip || rc=1 ;;
          esac
          exit $rc

  # RandomX full mode (the miner's default) against the official vectors and
  # light mode (what nodes verify with), on Linux; the developers' runs are on
  # Windows, so this is also a cross-platform check of the same vectors.
  randomx-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1"
      - name: Full mode vectors and full/light agreement (about 2.3 GiB RAM)
        run: cargo test --locked --release -p blacksilk-randomx -- --ignored --nocapture

  # The consensus-pinned guest programs rebuild from source to their pinned
  # program ids and to the committed bytes (zkvm/guests/README.md), on Windows,
  # Linux x86_64 and Linux arm64: the build is path-independent (stripped, no
  # located panics; R15-6), so every host must reproduce the same kernel.id
  # from its own checkout path. Known failure until the v3 rebuild: the Linux
  # legs differ in the non-loaded .comment bytes, which the current layout
  # hashes through the ELF header (CI-1; README "Open: header bytes in the id").
  # The build also checks the toolchain against zkvm/guests/toolchain.sha256,
  # here with the published manifest downloaded (CI-13).
  guests:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GUEST_REQUIRE_MANIFEST: "1"
      GUEST_VERIFY_MANIFEST_ONLINE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1"
          targets: riscv32i-unknown-none-elf
      - name: build.sh refuses overriding cargo config files (self-test)
        shell: bash
        run: bash .github/scripts/guests-config-selftest.sh
      - name: Rebuild px/kernel.elf and px/vault.elf and compare ids and bytes
        shell: bash
        run: bash .github/scripts/guests-reproduce.sh
      - name: RandomX reference vectors on Windows (cross-platform check)
        if: runner.os == 'Windows'
        run: cargo test --locked --release -p blacksilk-randomx

  # RustSec advisory database (docs/reviews/dependency-review.md §5), for the
  # main workspace and the separate fuzz workspace.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1"
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit
        # RUSTSEC-2024-0436 (paste, unmaintained, compile-time only via Plonky3)
        # is reviewed in dependency-review.md §5.
        run: |
          cargo audit --ignore RUSTSEC-2024-0436
          cargo audit --file fuzz/Cargo.lock --ignore RUSTSEC-2024-0436

  # Supply-chain policy (S1, dossier 44; W3-44): cargo-deny over the main and
  # fuzz workspaces (deny.toml, fuzz/deny.toml): advisories incl. unsound,
  # unmaintained and yanked; native-code bans; crates.io only; the exact
  # licence set; duplicate versions (dev-only included) against an exact
  # skip list; every build script allow-listed by exact version, and no
  # native executable, archive or script in build-time crates. `-D warnings`
  # also fails a stale skip, licence or ignore. Then the checks cargo-deny
  # cannot express: *-sys names and C in build scripts per release target
  # (sys-crates.sh), hazmat APIs outside their reviewed crates
  # (hazmat-policy.sh), and a warning when docs/reviews/unsafe-inventory.md
  # no longer matches the lockfile. Weekly too: new advisories and yanks do
  # not need a push.
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1"
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: cargo deny (main workspace)
        run: cargo deny --locked check -D warnings
      - name: cargo deny (fuzz workspace)
        if: success() || failure()
        working-directory: fuzz
        run: cargo deny --locked check -D warnings
      - name: No unreviewed *-sys crates; no C in build scripts (per release target)
        if: success() || failure()
        shell: bash
        run: bash .github/scripts/sys-crates.sh
      - name: Hazmat APIs only in their reviewed crates
        if: success() || failure()
        shell: bash
        run: bash .github/scripts/hazmat-policy.sh
      - name: unsafe inventory current (a warning, not a gate)
        if: success() || failure()
        shell: bash
        run: |
          bash .github/scripts/unsafe-report.sh --check ||
            echo "::warning title=unsafe inventory stale::docs/reviews/unsafe-inventory.md does not match Cargo.lock; run bash .github/scripts/unsafe-report.sh and commit it"

  # Commit gates (F48-3, decisions "Agent 48"), over the commits this event
  # adds after the cut-over commit in .github/scripts/gate-range.sh:
  # - commits touching consensus paths carry a Consensus-Change: trailer;
  # - commits changing Cargo.lock or fuzz/Cargo.lock name the crates they add
  #   or re-version;
  # - no invisible or bidirectional Unicode in tracked text files.
  # The SHAs come in through env, never interpolated into the script.
  gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GATE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      GATE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The gates walk the history back to the cut-over commit.
          fetch-depth: 0
      - name: Consensus-path trailer gate (self-test first)
        run: |
          bash .github/scripts/consensus-gate.sh --selftest
          bash .github/scripts/consensus-gate.sh "$GATE_BASE" "$GATE_HEAD"
      - name: Lockfile-diff gate
        if: success() || failure()
        run: bash .github/scripts/lockfile-gate.sh "$GATE_BASE" "$GATE_HEAD"
      - name: Invisible and bidirectional Unicode scan
        if: success() || failure()
        run: bash .github/scripts/unicode-scan.sh

  # Documentation lint (dossier 47 W47-8, decisions "Agent 47"): forbidden
  # claims, retired identifiers, broken relative links and copied digests
  # (.github/scripts/doc-lint.sh; docs/STATUS.md is the one status source).
  # Also the Wasm freeze (decision D22 "D-freeze"): wasmi must never come back
  # into the main or fuzz lockfile; the frozen `contracts/` crate has its own
  # workspace and is not built by CI (contracts/README.md).
  doc-lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: doc-lint self-test (a seeded failing fixture per rule)
        run: bash .github/scripts/doc-lint-selftest.sh
      - name: doc-lint
        if: success() || failure()
        run: bash .github/scripts/doc-lint.sh
      - name: No Wasm engine in the main or fuzz lockfile (D22)
        if: success() || failure()
        shell: bash
        run: |
          for f in Cargo.lock fuzz/Cargo.lock; do
            if grep -Eq '^name = "(wasmi|blacksilk-contracts)"$' "$f"; then
              echo "::error title=Wasm freeze::$f locks wasmi or blacksilk-contracts (decision D22: contracts/ stays outside the workspace)"
              exit 1
            fi
          done
          echo "no wasmi or blacksilk-contracts in Cargo.lock or fuzz/Cargo.lock"

  # Coverage-guided fuzzing smoke run (AUDIT.md "Coverage-guided fuzzing"):
  # a short run of every target with debug assertions; the script fails if a
  # target crashes, does not run, or executes no inputs. Long campaigns run
  # separately.
  fuzz-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TOOLCHAIN: nightly-2026-09-24
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-09-24
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Seeds
        run: cd fuzz && cargo +"$TOOLCHAIN" run --locked --release --bin seeds
      - name: Fuzz every target for 2 minutes
        run: bash fuzz/run_campaign.sh 120
