name: CI

on:
  push:
    branches: [main, rebuild/core]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: |
          cargo fmt --all --check
          (cd fuzz && cargo fmt --check)
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: No unsafe code in project crates
        run: |
          for c in randomx consensus crypto tx chain p2p rpc node miner wallet \
                   contracts zk zkvm px-core px tools/labnet; do
            grep -rq 'forbid(unsafe_code)' "$c/src" || { echo "$c lacks forbid(unsafe_code)"; exit 1; }
          done

  # The PX proofs make the suite far too slow unoptimized: tests run in release.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (release)
        run: cargo test --release --workspace --no-fail-fast

  # RustSec advisory database (docs/reviews/dependency-review.md §5).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        # RUSTSEC-2024-0436 (paste, unmaintained, compile-time only via Plonky3)
        # is reviewed in dependency-review.md §5.
        run: cargo audit --ignore RUSTSEC-2024-0436

  # Coverage-guided fuzzing smoke run (AUDIT.md "Coverage-guided fuzzing"):
  # a short run of every target; long campaigns run separately.
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Seeds
        run: cd fuzz && cargo run --release --bin seeds
      - name: Fuzz every target for 2 minutes
        run: TOOLCHAIN=nightly ./fuzz/run_campaign.sh 120
