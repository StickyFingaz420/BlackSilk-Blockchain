[package]
name = "blacksilk-wallet"
version = "0.1.0"
edition = "2021"
publish = false
description = "BlackSilk CLI wallet: encrypted wallet file, scanning, transfers"

[lib]
name = "blacksilk_wallet"

[[bin]]
name = "blacksilk-wallet"
path = "src/main.rs"

[dependencies]
blacksilk-consensus = { path = "../consensus" }
blacksilk-crypto = { path = "../crypto" }
blacksilk-tx = { path = "../tx" }
blacksilk-chain = { path = "../chain" }
blacksilk-rpc = { path = "../rpc" }
blacksilk-px = { path = "../px" }
blacksilk-px-core = { path = "../px-core" }
blacksilk-zkvm = { path = "../zkvm" }
rand_core = { version = "0.6", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.2"
zeroize = "1.8"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# Wallet-file AEAD, pinned and with the key schedules wiped on drop, as in
# p2p/Cargo.toml (`aes` and `polyval` are named for their `zeroize` features).
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
polyval = { version = "=0.6.2", default-features = false, features = ["zeroize"] }
rpassword = "7"

[dev-dependencies]
blacksilk-node = { path = "../node" }
blacksilk-miner = { path = "../miner" }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
tempfile = "3"

# `cfg(fuzzing)`: set by cargo-fuzz in fuzz builds only; src/main.rs refuses
# to compile with it (W4-GUARD).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
