[package]
name = "gui-wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.12", features = ["tokio"] }
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bip39 = "2"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1"
secrecy = "0.8"
sled = "0.34"
dirs = "5"
rpassword = "7"

[build-dependencies]
