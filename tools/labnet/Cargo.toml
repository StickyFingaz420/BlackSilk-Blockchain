[package]
name = "blacksilk-labnet"
version = "0.1.0"
edition = "2021"
description = "Lab network for BlackSilk: real node/miner processes behind latency and partition proxies, wallet traffic, invariant checks, long-duration runs"
publish = false

[[bin]]
name = "blacksilk-labnet"
path = "src/main.rs"

[dependencies]
blacksilk-consensus = { path = "../../consensus" }
blacksilk-chain = { path = "../../chain" }
blacksilk-rpc = { path = "../../rpc" }
blacksilk-tx = { path = "../../tx" }
blacksilk-wallet = { path = "../../wallet" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
clap = { version = "4.5", features = ["derive"] }
rand_chacha = { version = "0.3", default-features = false }
getrandom = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
