[package]
name = "blacksilk-supply-audit"
version = "0.1.0"
edition = "2021"
description = "Closed-set supply audit for BlackSilk trials: the sum of every wallet's v1 and PX holdings against the chain's emission and PX pool"
publish = false

[lib]
name = "blacksilk_supply_audit"

[[bin]]
name = "blacksilk-supply-audit"
path = "src/main.rs"

[dependencies]
blacksilk-consensus = { path = "../../consensus" }
blacksilk-chain = { path = "../../chain" }
blacksilk-rpc = { path = "../../rpc" }
blacksilk-tx = { path = "../../tx" }
blacksilk-wallet = { path = "../../wallet" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
rpassword = "7"
zeroize = "1.8"

[dev-dependencies]
blacksilk-node = { path = "../../node" }
blacksilk-miner = { path = "../../miner" }
blacksilk-crypto = { path = "../../crypto" }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
rand_chacha = { version = "0.3", default-features = false }
tempfile = "3"
