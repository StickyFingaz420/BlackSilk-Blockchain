[package]
name = "blacksilk-genesis"
version = "0.1.0"
edition = "2021"
description = "Deterministic, reproducible construction and verification of a BlackSilk genesis block from a Bitcoin block-hash beacon (docs/testnet-v3-genesis.md)"
publish = false

[lib]
name = "blacksilk_genesis"

[[bin]]
name = "blacksilk-genesis"
path = "src/main.rs"

[dependencies]
blacksilk-consensus = { path = "../../consensus" }

# `cfg(fuzzing)`: set by cargo-fuzz in fuzz builds only; src/main.rs refuses
# to compile with it and marks it (W4-GUARD).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
