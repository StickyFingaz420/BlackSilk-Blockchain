global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: 'blacksilk_nodes'
    static_configs:
      - targets:
        - 'blacksilk-node:19333'
        - 'blacksilk-seed1:19333'
        - 'blacksilk-seed2:19333'
        - 'blacksilk-seed3:19333'

  - job_name: 'blacksilk_explorer'
    static_configs:
      - targets:
        - 'blacksilk-explorer:8080'

  - job_name: 'blacksilk_faucet'
    static_configs:
      - targets:
        - 'blacksilk-faucet:8081'
