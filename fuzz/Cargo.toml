# Coverage-guided fuzzing (cargo-fuzz / libFuzzer), AUDIT.md "Fuzzing".
# Needs a nightly toolchain: `cargo +nightly fuzz run <target>`.
# libFuzzer is C++ test tooling linked only into these fuzz binaries; nothing
# here is part of the node, wallet or miner (docs/reviews/dependency-review.md).
[package]
name = "blacksilk-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# `cfg(fuzzing)`: set by cargo-fuzz for every crate of a fuzz build.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
blacksilk-consensus = { path = "../consensus" }
blacksilk-crypto = { path = "../crypto" }
blacksilk-tx = { path = "../tx" }
blacksilk-chain = { path = "../chain" }
# `test-hooks`: the stateful targets' harness (`net::fuzzing`).
blacksilk-p2p = { path = "../p2p", features = ["test-hooks"] }
blacksilk-zk = { path = "../zk" }
blacksilk-zkvm = { path = "../zkvm" }
blacksilk-px = { path = "../px" }
blacksilk-px-core = { path = "../px-core" }
rand_chacha = { version = "0.3", default-features = false }
# The transport target's runtime, and what wallet/src/seed.rs (included by
# path in the seed_words target) uses. All three are already in this lock
# through p2p and crypto; no new crate.
# `test-util`: the paused clock of peer_protocol (no new crate).
tokio = { version = "1", default-features = false, features = ["rt", "io-util", "time", "macros", "sync", "test-util"] }
zeroize = "1.8"
getrandom = "0.2"

# Its own workspace, so it never affects the main build.
[workspace]
members = ["."]

# The same patched Plonky3 crates as the main workspace (third_party/README.md).
[patch.crates-io]
p3-fri = { path = "../third_party/p3-fri" }
p3-merkle-tree = { path = "../third_party/p3-merkle-tree" }
p3-dft = { path = "../third_party/p3-dft" }
p3-batch-stark = { path = "../third_party/p3-batch-stark" }

[profile.release]
debug = 1

[[bin]]
name = "seeds"
path = "src/seeds.rs"
test = false
doc = false

