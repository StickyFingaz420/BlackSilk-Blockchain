[workspace]
members = [
    "wallet",
    "node",
    "marketplace",
    "primitives",
    "miner",
    "web-wallet",
    "testnet-faucet",
    "smart-contracts/escrow_contract",
    "smart-contracts/marketplace_contract",
    "smart-contracts/randomx",
    "pqcrypto_native",
    "scripts", # Added scripts for Rust comparison tool
    "pqsignatures",
    "ml-dsa-44" # Only keep ml-dsa-44, remove ml-dsa44-standalone
]

[package]
name = "BlackSilk"
version = "0.1.0"
edition = "2021"

[dependencies]
node = { path = "node" }
primitives = { path = "primitives" }
ml-dsa-44 = { path = "ml-dsa-44" }
hex = "0.4"
sha3 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9.1"
# Uncomment if you want to use Criterion for benchmarking
# criterion = "0.3"

[build-dependencies]
cc = "1.0"
reqwest = { version = "0.11", features = ["blocking"] }

[dev-dependencies]
pqcrypto_native = { path = "pqcrypto_native" }
ml-dsa-44 = { path = "ml-dsa-44" } # Only use the new ml-dsa-44 FFI-based library

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug-assertions = false
strip = true

# Ultra-aggressive CPU optimizations for mining
[profile.release.package."blacksilk-miner"]
opt-level = 3
overflow-checks = false

# [patch.crates-io]
# signature = "=2.3.0-pre.5"

[features]
debug_kat = []
