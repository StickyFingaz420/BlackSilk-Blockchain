[workspace]
resolver = "2"
members = [
    "randomx",   # blacksilk-randomx: the single RandomX implementation
    "consensus", # blacksilk-consensus: header-chain rules
    "crypto",    # blacksilk-crypto: CLSAG, Bulletproofs+, stealth outputs, Janus anchor
    "tx",        # blacksilk-tx: transaction format, building, validation
    "chain",     # blacksilk-chain: blocks, emission, chain manager, mempool, storage
    "p2p",       # blacksilk-p2p: peer-to-peer network
    "rpc",       # blacksilk-rpc: node RPC types and client
    "node",      # blacksilk-node: the node binary (RPC)
    "miner",     # blacksilk-miner: RandomX miner
    "wallet",    # blacksilk-wallet: CLI wallet
    "contracts", # blacksilk-contracts: confidential contracts (Wasm engine, state)
    "zk",        # blacksilk-zk: zero-knowledge proof layer (Plonky3 STARK, BS-ZK-1)
    "zkvm",      # blacksilk-zkvm: BVM-1 zero-knowledge virtual machine (RV32IM)
    "tools/labnet", # blacksilk-labnet: long-duration lab network test
]
# Pre-rebuild code kept for reference only (does not build; see legacy/README.md),
# and the post-quantum research track.
exclude = ["legacy", "research"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwind, not abort: the zero-knowledge verifier contains panics from malformed
# proofs with catch_unwind (zk/src/lib.rs, docs/zkvm.md §10), which abort would defeat.
panic = "unwind"
debug-assertions = false
strip = true

# RandomX is unusably slow unoptimized (256 MiB Argon2 fill, ~16k dataset
# items per hash), so optimize it and its hash primitives even in dev builds.
[profile.dev.package.blacksilk-randomx]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
# Elliptic-curve code is 10-50x slower unoptimized; tests prove and verify
# hundreds of Bulletproofs+ and CLSAGs.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.blacksilk-crypto]
opt-level = 3
[profile.dev.package.blacksilk-tx]
opt-level = 3
# Wallet file key derivation (Argon2id) in tests.
[profile.dev.package.argon2]
opt-level = 3
