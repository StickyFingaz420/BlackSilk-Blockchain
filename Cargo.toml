[workspace]
resolver = "2"
members = [
    "randomx",   # blacksilk-randomx: the single RandomX implementation
    "consensus", # blacksilk-consensus: header-chain rules
    "crypto",    # blacksilk-crypto: CLSAG, Bulletproofs+, stealth outputs, Janus anchor
    "tx",        # blacksilk-tx: transaction format, building, validation
    "chain",     # blacksilk-chain: blocks, emission, chain manager, mempool, storage
    "p2p",       # blacksilk-p2p: peer-to-peer network
    "rpc",       # blacksilk-rpc: node RPC types and client
    "node",      # blacksilk-node: the node binary (RPC)
    "miner",     # blacksilk-miner: RandomX miner
    "wallet",    # blacksilk-wallet: CLI wallet
    "zk",        # blacksilk-zk: zero-knowledge proof layer (Plonky3 STARK, parameter set BS-ZK-3)
    "zkvm",      # blacksilk-zkvm: BVM-1 zero-knowledge virtual machine (RV32I + Zmmul)
    "px-core",   # blacksilk-px-core: PX hash, records and transfer kernel (no_std, shared with the guest)
    "px",        # blacksilk-px: PX node state, wallet side, record delivery, kernel proofs
    "tools/labnet", # blacksilk-labnet: long-duration lab network test
    "tools/supply-audit", # blacksilk-supply-audit: closed-set supply check (trial)
    "tools/genesis", # blacksilk-genesis: beacon-derived genesis construction and verification
    "tools/daa-sim", # blacksilk-daa-sim: difficulty-rule simulation harness (evidence, not consensus)
]
# The pre-rebuild code once kept in `legacy/` was removed from the tree on 2026-10-04
# (see git history up to 57dd81a), the post-quantum `research/` tree on 2026-10-05
# (removed in 5038b1a; it stays in git history). `contracts` is the frozen Wasm contract
# research crate (decision D22 "D-freeze", ADR-28-1: PX is the only consensus
# contract platform): its own workspace and Cargo.lock, like `fuzz`, so the Wasm
# engine is in no build, lockfile or binary of this workspace (contracts/README.md).
# `tools/tpgate`, the third-party gate's checker, is its own workspace too, so CI
# can build it from a trusted revision outside the checkout (RT-TPGATE3).
exclude = ["third_party", "fuzz", "contracts", "tools/tpgate"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwind, not abort: the zero-knowledge verifier contains panics from malformed
# proofs with catch_unwind (zk/src/lib.rs, docs/zkvm.md §10), which abort would defeat.
panic = "unwind"
debug-assertions = false
strip = true

# RandomX is unusably slow unoptimized (256 MiB Argon2 fill, ~16k dataset
# items per hash), so optimize it and its hash primitives even in dev builds.
[profile.dev.package.blacksilk-randomx]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
# Elliptic-curve code is 10-50x slower unoptimized; tests prove and verify
# hundreds of Bulletproofs+ and CLSAGs.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.blacksilk-crypto]
opt-level = 3
[profile.dev.package.blacksilk-tx]
opt-level = 3
# Wallet file key derivation (Argon2id) in tests.
[profile.dev.package.argon2]
opt-level = 3

# Mutation testing (`cargo mutants --profile mutants`, decisions "Agent 42";
# docs/evidence/mutation-*). The test profile with every dependency optimized,
# so the px differential tests (the guest interpreter) and RandomX run fast.
# The mutated crate and the crates rebuilt after it (px for px-core) stay at
# the test profile's settings: optimizing them costs minutes per mutant and
# saves seconds of test time. Overflow checks and
# debug assertions stay on, so a mutant that overflows is caught. No release
# artifact uses this profile.
[profile.mutants]
inherits = "test"
debug = false
[profile.mutants.package."*"]
opt-level = 3
[profile.mutants.package.blacksilk-randomx]
opt-level = 3
[profile.mutants.package.blacksilk-crypto]
opt-level = 3
[profile.mutants.package.blacksilk-zk]
opt-level = 3
[profile.mutants.package.blacksilk-zkvm]
opt-level = 3

# Patched Plonky3 0.7.0 crates (third_party/README.md): spin locks held across
# rayon work could hang the prover (AUDIT.md ZK-F11, ZK-F21). Only lock scopes
# change. p3-dft is fixed upstream in 0.8.0; p3-fri and p3-merkle-tree are not.
[patch.crates-io]
p3-fri = { path = "third_party/p3-fri" }
p3-merkle-tree = { path = "third_party/p3-merkle-tree" }
p3-dft = { path = "third_party/p3-dft" }
p3-batch-stark = { path = "third_party/p3-batch-stark" }
