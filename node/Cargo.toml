[package]
name = "blacksilk-node"
version = "0.1.0"
edition = "2021"
description = "BlackSilk node: chain manager, block storage and local RPC"

[lib]
name = "blacksilk_node"

[[bin]]
name = "blacksilk-node"
path = "src/main.rs"

[dependencies]
blacksilk-chain = { path = "../chain" }
blacksilk-consensus = { path = "../consensus" }
blacksilk-tx = { path = "../tx" }
blacksilk-rpc = { path = "../rpc" }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = { version = "0.8", default-features = false, features = ["humantime"] }
getrandom = "0.2"
fs2 = "0.4"
dirs = "5"

[dev-dependencies]
blacksilk-crypto = { path = "../crypto" }
rand_chacha = { version = "0.3", default-features = false }
tempfile = "3"
