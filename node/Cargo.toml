[package]
name = "blacksilk-node"
version = "0.1.0"
edition = "2021"
publish = false
description = "BlackSilk node: chain manager, block storage and local RPC"

[lib]
name = "blacksilk_node"

[[bin]]
name = "blacksilk-node"
path = "src/main.rs"

[dependencies]
blacksilk-chain = { path = "../chain" }
blacksilk-consensus = { path = "../consensus" }
blacksilk-tx = { path = "../tx" }
blacksilk-rpc = { path = "../rpc" }
blacksilk-p2p = { path = "../p2p" }
# Consensus fingerprint (src/fingerprint.rs): the PX-side manifest, the
# RandomX configuration and the fixture transfer's points (crypto). All are
# already in the dependency graph via chain (crypto was a dev-dependency).
blacksilk-crypto = { path = "../crypto" }
blacksilk-px = { path = "../px" }
blacksilk-randomx = { path = "../randomx" }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# The RPC serve loop (src/serve.rs): hyper's HTTP/1 connections with a timer,
# for the header-read timeout axum 0.7's `serve` cannot set. Both are already
# in the graph through axum, with these features; no new crate.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "service", "http1"] }
# Constant-time credential comparison (src/guard.rs); already used by
# blacksilk-crypto, same version and features.
subtle = { version = "2.6", default-features = false }
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = { version = "0.8", default-features = false, features = ["humantime"] }
getrandom = "0.2"
fs2 = "0.4"
dirs = "5"
toml = "0.8"

[dev-dependencies]
# Fault injection for the halt exit-status test (tests/halt_exit.rs).
blacksilk-chain = { path = "../chain", features = ["test-hooks"] }
rand_chacha = { version = "0.3", default-features = false }
tempfile = "3"
