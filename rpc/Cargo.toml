[package]
name = "blacksilk-rpc"
version = "0.1.0"
edition = "2021"
description = "BlackSilk node RPC: wire types shared by node, miner and wallet, and a blocking client"

[lib]
name = "blacksilk_rpc"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
# Plain HTTP to the local node only; no TLS stack is compiled in.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
