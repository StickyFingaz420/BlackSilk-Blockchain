[package]
name = "blacksilk-tx"
version = "0.1.0"
edition = "2021"
description = "BlackSilk transactions: canonical format, wallet-side building and scanning, consensus validation"

[lib]
name = "blacksilk_tx"

[dependencies]
blacksilk-crypto = { path = "../crypto" }
blacksilk-consensus = { path = "../consensus" }
rand_core = { version = "0.6", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[dev-dependencies]
rand_chacha = { version = "0.3", default-features = false }
