[package]
name = "blacksilk-tx"
version = "0.1.0"
edition = "2021"
publish = false
description = "BlackSilk transactions: canonical format, wallet-side building and scanning, consensus validation"

[lib]
name = "blacksilk_tx"

[dependencies]
blacksilk-crypto = { path = "../crypto" }
blacksilk-consensus = { path = "../consensus" }
# Private execution (PX) transactions: statement, proof verification, state.
blacksilk-px = { path = "../px" }
blacksilk-px-core = { path = "../px-core" }
blacksilk-zkvm = { path = "../zkvm" }
blacksilk-zk = { path = "../zk" }
rand_core = { version = "0.6", default-features = false }
log = "0.4"
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[features]
# Test-only fault injection (`MemoryChain::fail_next_apply_for_tests`) and the
# PX test constructors. Only dev-dependencies turn it on, but `cargo test`
# unifies it into every binary the same invocation writes: binaries mark it
# (`TEST_HOOKS_MARKER`) and refuse every network but regtest (W4-GUARD).
test-hooks = ["blacksilk-px/test-hooks"]

[dev-dependencies]
rand_chacha = { version = "0.3", default-features = false }
# A PX state near tree capacity for tests/tree_capacity.rs.
blacksilk-px = { path = "../px", features = ["test-hooks"] }
# This crate's own test constructors (`MemoryChain::with_px_state`) for its
# integration tests, which build the library without `cfg(test)`.
blacksilk-tx = { path = ".", features = ["test-hooks"] }
