[package]
name = "blacksilk-p2p"
version = "0.1.0"
edition = "2021"
publish = false
description = "BlackSilk peer-to-peer network: encrypted transport, header-first sync, relay, Dandelion++, peer management"

[lib]
name = "blacksilk_p2p"

[dependencies]
blacksilk-consensus = { path = "../consensus" }
blacksilk-crypto = { path = "../crypto" }
blacksilk-tx = { path = "../tx" }
blacksilk-chain = { path = "../chain" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
# Session AEAD. =0.10.3 is the first release with the GHSA-423w-p2w9-r7vq fix.
# Its `zeroize` feature wipes only a temporary copy of the GHASH key, so `aes`
# and `polyval` are named here for their `zeroize` features alone (feature
# unification): the AES round keys and the GHASH key state are wiped on drop.
# Residual: polyval's aarch64 PMULL backend has no wipe (dossier 44 P3.7).
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
polyval = { version = "=0.6.2", default-features = false, features = ["zeroize"] }
rand_core = { version = "0.6", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
getrandom = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
log = "0.4"
zeroize = "1.8"
# SHA3-256 for the Tor v3 onion-name checksum (rend-spec-v3). Pure Rust
# (RustCrypto); already in the lockfile through ml-kem, so no new crate.
sha3 = { version = "=0.11.0", default-features = false }

# `cfg(fuzzing)`: set by cargo-fuzz in fuzz builds only (transport.rs,
# `fuzzing`).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dev-dependencies]
tempfile = "3"
# The chain actor's test-only step delay (liveness test L7).
blacksilk-chain = { path = "../chain", features = ["test-hooks"] }
blacksilk-px = { path = "../px" }
