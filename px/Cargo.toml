[package]
name = "blacksilk-px"
version = "0.1.0"
edition = "2021"
publish = false
description = "BlackSilk private execution (PX): commitment tree, nullifier set and pool state, wallet-side records, kernel proofs (docs/px.md)"

[lib]
name = "blacksilk_px"

[dependencies]
blacksilk-px-core = { path = "../px-core" }
blacksilk-crypto = { path = "../crypto" }
blacksilk-zk = { path = "../zk" }
blacksilk-zkvm = { path = "../zkvm" }
p3-field = "=0.7.0"
p3-baby-bear = "=0.7.0"
p3-symmetric = "=0.7.0"
rand_core = { version = "0.6", default-features = false }
# Record delivery (docs/px.md §6): FIPS 203 ML-KEM-768 and ChaCha20-Poly1305,
# both RustCrypto, pure Rust. Wallet-side only; not consensus code.
ml-kem = { version = "=0.3.2", features = ["hazmat", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
zeroize = "1.8"

[features]
# Test-only constructors (a state near tree capacity). Only dev-dependencies
# turn it on, but `cargo test` unifies it into every binary the same
# invocation writes: binaries mark it (`TEST_HOOKS_MARKER`) and refuse every
# network but regtest (W4-GUARD).
test-hooks = []

[dev-dependencies]
rand_chacha = { version = "0.3", default-features = false }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = "=1.0.229"
