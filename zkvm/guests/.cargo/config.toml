[build]
# RV32I + Zmmul (multiplication, no hardware division): docs/zkvm.md §4.
target = "riscv32i-unknown-none-elf"

[target.riscv32i-unknown-none-elf]
# Static, non-PIE; the default lld layout starts above the 4 KiB null guard.
# build.sh is the single source of these flags (GUEST_FLAGS) and fails if this
# line differs from them. A plain `cargo build` here is not the reproducible
# build: that one also fixes the build path (build.sh, README.md).
rustflags = ["-C", "relocation-model=static", "-C", "target-feature=+zmmul"]
