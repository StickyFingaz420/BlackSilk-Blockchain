[build]
# RV32I + Zmmul (multiplication, no hardware division): docs/zkvm.md §4.
target = "riscv32i-unknown-none-elf"

[target.riscv32i-unknown-none-elf]
# Static, non-PIE; the default lld layout starts above the 4 KiB null guard.
# --strip-all: no symbol table (path-dependent crate hashes), README.md.
# build.sh is the single source of these flags (GUEST_FLAGS) and fails if this
# line differs from them. A plain `cargo build` here gives the same bytes as
# build.sh with the pinned rustc (rust-toolchain.toml).
rustflags = ["-C", "relocation-model=static", "-C", "target-feature=+zmmul", "-C", "link-arg=--strip-all"]
