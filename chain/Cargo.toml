[package]
name = "blacksilk-chain"
version = "0.1.0"
edition = "2021"
publish = false
description = "BlackSilk blocks, emission, chain manager (header chain + transaction state + reorgs), mempool and block storage"

[lib]
name = "blacksilk_chain"

[dependencies]
blacksilk-consensus = { path = "../consensus" }
blacksilk-crypto = { path = "../crypto" }
blacksilk-tx = { path = "../tx" }
blacksilk-px = { path = "../px" }
blacksilk-px-core = { path = "../px-core" }
rand_core = { version = "0.6", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
bs58 = "0.5"
crc32fast = "1.4"
log = "0.4"

[features]
# Test-only fault injection and observation (`ChainManager::
# fail_next_apply_for_tests` for the node's halt exit-status test,
# `set_step_delay_for_tests`, and the chain actor's linearization log and
# panic command). Only dev-dependencies turn it on, but `cargo test` unifies
# it into every binary the same invocation writes: binaries mark it
# (`TEST_HOOKS_MARKER`) and refuse every network but regtest (W4-GUARD).
test-hooks = ["blacksilk-tx/test-hooks"]

# `cfg(fuzzing)`: set by cargo-fuzz in fuzz builds only; its build marker
# (src/build_flags.rs, W4-GUARD).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dev-dependencies]
tempfile = "3"
# Fault injection for the apply-failure halt test (manager unit tests).
blacksilk-tx = { path = "../tx", features = ["test-hooks"] }
blacksilk-randomx = { path = "../randomx" }
# The chain actor's test-only log and panic command (tests/actor_*.rs), as
# tx enables its own hooks for its tests.
blacksilk-chain = { path = ".", features = ["test-hooks"] }
# Property tests of the reference model (chain/tests/reference_model.rs).
# Approved in decisions (Agents 02, 41, 44): pure Rust, std only.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
